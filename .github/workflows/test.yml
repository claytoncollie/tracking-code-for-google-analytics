name: Automated Testing

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  phpcs:
    name: PHP Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Install Composer Dependencies
      run: composer install

    - name: Lint Coding Standards
      run: composer run phpcs

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Install Composer Dependencies
      run: composer install

    - name: Static Analysis
      run: composer run phpstan

  cypress:
    name: ${{ matrix.core.name }}
    runs-on: ubuntu-latest
    needs: [phpcs,phpstan]
    strategy:
      matrix:
        core:
          - {name: 'WordPress Latest', version: 'latest'}
          - {name: 'WordPress Minimum', version: 'WordPress/WordPress#6.2'}
          - {name: 'WordPress Trunk', version: 'WordPress/WordPress#master'}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: npm install

    - name: Fix simple-git clone check (steveukx/git-js#1121)
      run: node -e "var f=require('fs'),p='node_modules/simple-git/dist/cjs/index.js';f.writeFileSync(p,f.readFileSync(p,'utf8').replace(/allowUnsafePack\s*=\s*(false|!1)/g,'allowUnsafePack=true'))"

    - name: Composer
      run: composer install
      continue-on-error: true

    - name: Set the core version
      run: ./tests/bin/set-core-version.js ${{ matrix.core.version }}

    - name: Set up WP environment
      run: npm run env:start

    - name: e2e Test
      run: npm run cypress:run
