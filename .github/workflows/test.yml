name: Automated Testing

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  phpcs:
    name: PHP Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Install Composer Dependencies
      run: composer install

    - name: Lint Coding Standards
      run: composer run phpcs

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Install Composer Dependencies
      run: composer install

    - name: Static Analysis
      run: composer run phpstan

  phpunit:
    name: PHPUnit - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Start MySQL
      run: sudo systemctl start mysql.service

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none
        tools: composer:v2

    - name: Install dependencies
      run: composer install

    - name: Setup WP Tests
      run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

    - name: PHPUnit
      run: composer run phpunit

  cypress:
    needs: [phpcs,phpstan]
    name: Cypress - PHP ${{ matrix.php.name }} with ${{ matrix.wordpress.name }}
    continue-on-error: ${{ matrix.wordpress.version == 'WordPress/WordPress#master' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - {name: '7.4', version: '7.4'}
          - {name: '8.2', version: '8.2'}
          - {name: '8.4', version: '8.4'}
        wordpress:
          - {name: 'WordPress 6.2', version: 'WordPress/WordPress#6.2'}
          - {name: 'WordPress Latest', version: 'latest'}
          - {name: 'WordPress Trunk', version: 'WordPress/WordPress#master'}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use desired version of Node.js
      uses: actions/setup-node@v4
      with:
          node-version-file: '.nvmrc'

    - name: Install dependencies
      run: npm install

    - name: Composer install
      run: composer install

    - name: Set the core version
      run: ./tests/bin/set-core-version.js ${{ matrix.wordpress.version }} ${{ matrix.php.version }}

    - name: Set up WP environment
      run: npm run env:start

    - name: Log WP environment versions
      run: |
        npx wp-env run cli "wp core version"
        npx wp-env run cli "php --version"

    - name: Test
      run: npm run cypress:run
